[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kokogram-shared"
version = "0.1.0"
description = "Общие абстракции Kokogram: время, идентификаторы, токены, ошибки"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]

[tool.setuptools.packages.find]
include = ["kokogram_shared*"]
