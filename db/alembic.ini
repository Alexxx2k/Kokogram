# Alembic для всех сервисов (один экземпляр PostgreSQL, HLD §3).
# Запуск из корня репозитория: python -m alembic -c db/alembic.ini <команда>
# Адрес БД берётся из переменных окружения (см. db/migrations/env.py), не отсюда.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Файлы ревизий называются по id: 0001_users.py (id задаются вручную)
file_template = %%(rev)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
